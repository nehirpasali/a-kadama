<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Yönetici Paneli</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px 16px 40px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        .panel {
            width: 100%;
            max-width: 480px;
            margin: auto 0;
            padding: 28px 22px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        h1 { font-size: 1.35rem; font-weight: 500; margin-bottom: 6px; text-align: center; }
        .sub { font-size: 0.85rem; opacity: 0.65; text-align: center; margin-bottom: 20px; }

        label { display: block; font-size: 0.8rem; opacity: 0.7; margin: 14px 0 6px; }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            font-family: inherit;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            color-scheme: dark;
        }

        input:focus, textarea:focus {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.15);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }

        input[type="file"] { padding: 10px; font-size: 0.9rem; }

        textarea { min-height: 170px; resize: vertical; line-height: 1.5; }

        .count { font-size: 0.75rem; opacity: 0.5; text-align: right; margin-top: 4px; }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            font-size: 1.02rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #e94560, #c23a51);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4); }
        button:disabled { opacity: 0.5; cursor: wait; transform: none; box-shadow: none; }

        button.ghost {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 16px 0 0;
            font-size: 0.88rem;
            opacity: 0.95;
            cursor: pointer;
        }

        .check input[type="checkbox"] {
            width: 20px;
            height: 20px;
            padding: 0;
            margin-top: 1px;
            flex: none;
            border-radius: 4px;
            accent-color: #e94560;
        }

        .check small { display: block; opacity: 0.6; margin-top: 2px; font-size: 0.75rem; }

        .msg { min-height: 22px; margin-top: 14px; font-size: 0.88rem; text-align: center; line-height: 1.4; }
        .msg.ok { color: #7bed9f; }
        .msg.err { color: #ff6b6b; }

        /* Sekmeler */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab {
            margin-top: 0;
            padding: 11px 8px;
            font-size: 0.92rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .tab.active { background: linear-gradient(135deg, #e94560, #c23a51); border-color: transparent; }

        /* Fotoğraf listesi */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 18px;
        }

        .thumb {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .thumb .cap {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 14px 6px 4px;
            font-size: 0.65rem;
            line-height: 1.2;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75), transparent);
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .thumb .del {
            position: absolute;
            top: 5px; right: 5px;
            width: 28px; height: 28px;
            margin: 0; padding: 0;
            font-size: 0.85rem;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .empty { grid-column: 1 / -1; text-align: center; opacity: 0.55; font-size: 0.88rem; padding: 18px 0; }
        .total { font-size: 0.8rem; opacity: 0.6; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>

    <!-- GİRİŞ -->
    <div class="panel" id="loginBox">
        <h1>Yönetici Girişi 🔐</h1>
        <p class="sub">Sadece sen girebilirsin</p>

        <label for="email">E-posta</label>
        <input type="email" id="email" autocomplete="username">

        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" autocomplete="current-password">

        <button id="girisBtn">Giriş yap</button>
        <p class="msg" id="loginMsg"></p>
    </div>

    <!-- PANEL -->
    <div class="panel" id="editBox" style="display:none">
        <div class="tabs">
            <button class="tab active" data-tab="not">💌 Günün notu</button>
            <button class="tab" data-tab="foto">📷 Fotoğraflar</button>
        </div>

        <!-- NOT SEKMESİ -->
        <div id="tabNot">
            <p class="sub">Kaydedince siteye anında düşer</p>

            <label for="tarih">Hangi gün için?</label>
            <input type="date" id="tarih">

            <label for="metin">Not</label>
            <textarea id="metin" placeholder="Bugünkü notunu yaz aşkım..."></textarea>
            <div class="count"><span id="sayi">0</span> karakter</div>

            <label class="check" for="mailGonder">
                <input type="checkbox" id="mailGonder" checked>
                <span>Kaydedince ona "siteye bak" maili gönder 💌
                    <small id="mailNot">Mail sadece bugünün notu için gider</small>
                </span>
            </label>

            <button id="kaydetBtn">Kaydet</button>
            <button class="ghost" id="silBtn">Bu günün notunu sil</button>
            <p class="msg" id="editMsg"></p>
        </div>

        <!-- FOTOĞRAF SEKMESİ -->
        <div id="tabFoto" style="display:none">
            <p class="sub">Yüklediğin fotoğraflar sitedeki galeriye anında eklenir</p>

            <label for="dosyalar">Fotoğraf seç (birden fazla seçebilirsin)</label>
            <input type="file" id="dosyalar" accept="image/*" multiple>

            <label for="baslik">Alt yazı (isteğe bağlı, seçtiklerinin hepsine yazılır)</label>
            <input type="text" id="baslik" maxlength="120" placeholder="örn. İlk buluşmamız ❤️">

            <button id="yukleBtn">Yükle</button>
            <p class="msg" id="fotoMsg"></p>

            <div class="grid" id="fotoListe"></div>
            <p class="total" id="fotoToplam"></p>
        </div>

        <button class="ghost" id="cikisBtn">Çıkış</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, serverTimestamp,
                 collection, addDoc, query, orderBy, limit, onSnapshot }
            from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGJShg-OYUPmjg0D3yw2INrdfPiPPWxBU",
            authDomain: "admin-7659a.firebaseapp.com",
            projectId: "admin-7659a",
            storageBucket: "admin-7659a.firebasestorage.app",
            messagingSenderId: "155622622732",
            appId: "1:155622622732:web:607b42a6ea36370a161029"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const $ = (id) => document.getElementById(id);

        function mesaj(el, text, tur) {
            el.textContent = text;
            el.className = 'msg ' + (tur || '');
        }

        function bugunAnahtar() {
            const b = new Date();
            return `${b.getFullYear()}-${String(b.getMonth() + 1).padStart(2, '0')}-${String(b.getDate()).padStart(2, '0')}`;
        }

        function hataYazisi(e) {
            if (e.code === 'permission-denied') {
                return 'İzin yok. Firebase Rules bölümüne "fotolar" kuralını eklediğinden emin ol.';
            }
            return (e.code || e.message || 'bilinmeyen hata');
        }

        // ----- Giriş / çıkış -----
        async function girisYap() {
            const btn = $('girisBtn');
            btn.disabled = true;
            mesaj($('loginMsg'), 'Giriş yapılıyor...');
            try {
                await signInWithEmailAndPassword(auth, $('email').value.trim(), $('sifre').value);
                mesaj($('loginMsg'), '');
            } catch (e) {
                const kod = e.code || e.message;
                const acik = {
                    'auth/invalid-credential': 'E-posta ya da şifre hatalı.',
                    'auth/invalid-email': 'E-posta adresi geçersiz görünüyor.',
                    'auth/operation-not-allowed': 'Firebase\'de Email/Password girişi açık değil.',
                    'auth/too-many-requests': 'Çok fazla deneme yapıldı, biraz bekle.',
                    'auth/network-request-failed': 'İnternet ya da engelleyici eklenti sorunu.'
                };
                mesaj($('loginMsg'), (acik[kod] || 'Giriş başarısız') + ' [' + kod + ']', 'err');
            }
            btn.disabled = false;
        }

        $('girisBtn').addEventListener('click', girisYap);
        $('sifre').addEventListener('keydown', (e) => { if (e.key === 'Enter') girisYap(); });
        $('cikisBtn').addEventListener('click', () => signOut(auth));

        let fotoDinleyiciKapat = null;

        onAuthStateChanged(auth, (user) => {
            $('loginBox').style.display = user ? 'none' : 'block';
            $('editBox').style.display = user ? 'block' : 'none';
            if (user) {
                if (!$('tarih').value) $('tarih').value = bugunAnahtar();
                notuYukle();
                mailKutusunuAyarla();
                fotolariDinle();
            } else if (fotoDinleyiciKapat) {
                fotoDinleyiciKapat();
                fotoDinleyiciKapat = null;
            }
        });

        // ----- Sekmeler -----
        document.querySelectorAll('.tab').forEach((t) => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
                $('tabNot').style.display = t.dataset.tab === 'not' ? 'block' : 'none';
                $('tabFoto').style.display = t.dataset.tab === 'foto' ? 'block' : 'none';
            });
        });

        // ===================== MAİL BİLDİRİMİ (EmailJS) =====================
        // >>> MAIL
        // EmailJS panelinden alacağın üç bilgiyi tırnakların içine yapıştır:
        const EMAILJS_SERVIS  = "service_3jrgaj6";
        const EMAILJS_SABLON  = "service_3jrgaj6";
        const EMAILJS_ANAHTAR = "zTwvwLTumfE4UA28S";

        // Mailin içinde görünecek site adresi
        const SITE_ADRESI = "https://nehirpasali.github.io/a-kadama/";

        // Kısa süre içinde yanlışlıkla art arda mail gitmesin diye uyarı süresi (dakika)
        const MAIL_BEKLEME_DK = 10;

        function mailAyariVar() {
            return ![EMAILJS_SERVIS, EMAILJS_SABLON, EMAILJS_ANAHTAR].some((d) => d.startsWith("zTwvwLTumfE4UA28S"));
        }

        function sonMailZamani() {
            try { return Number(localStorage.getItem('sonMailZamani')) || 0; } catch (e) { return 0; }
        }

        function sonMailZamaniniKaydet() {
            try { localStorage.setItem('sonMailZamani', String(Date.now())); } catch (e) { /* önemli değil */ }
        }

        async function bildirimMailiGonder() {
            const cevap = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    service_id: EMAILJS_SERVIS,
                    template_id: EMAILJS_SABLON,
                    user_id: EMAILJS_ANAHTAR,
                    template_params: {
                        site_url: SITE_ADRESI,
                        // Her mail farklı görünsün (Gmail aynı konulu mailleri tek konuşmada toplar)
                        zaman: new Date().toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })
                    }
                })
            });
            if (!cevap.ok) throw new Error((await cevap.text()) || ('Hata kodu ' + cevap.status));
        }
        // <<< MAIL

        // Not bugüne aitse mail kutusu işaretli gelir, ileri bir tarihse işareti kalkar
        function mailKutusunuAyarla() {
            const bugun = $('tarih').value === bugunAnahtar();
            $('mailGonder').checked = bugun;
            $('mailNot').textContent = bugun
                ? 'Mail sadece bugünün notu için gider'
                : 'Bu not ileri bir tarih için, o gün gelince site zaten gösterecek (mail gönderilmez)';
        }

        // ===================== NOT =====================
        async function notuYukle() {
            const gun = $('tarih').value;
            if (!gun) return;
            mesaj($('editMsg'), 'Yükleniyor...');
            try {
                const snap = await getDoc(doc(db, 'notlar', gun));
                $('metin').value = snap.exists() ? snap.data().metin : '';
                $('sayi').textContent = $('metin').value.length;
                mesaj($('editMsg'), snap.exists() ? 'Bu güne ait kayıtlı not yüklendi.' : 'Bu gün için henüz not yok.');
            } catch (e) {
                mesaj($('editMsg'), 'Not okunamadı: ' + hataYazisi(e), 'err');
            }
        }

        $('tarih').addEventListener('change', () => { notuYukle(); mailKutusunuAyarla(); });
        $('metin').addEventListener('input', () => { $('sayi').textContent = $('metin').value.length; });

        $('kaydetBtn').addEventListener('click', async () => {
            const gun = $('tarih').value;
            const metin = $('metin').value.trim();
            if (!gun) return mesaj($('editMsg'), 'Bir tarih seç.', 'err');
            if (!metin) return mesaj($('editMsg'), 'Not boş olamaz.', 'err');

            $('kaydetBtn').disabled = true;
            try {
                await setDoc(doc(db, 'notlar', gun), { metin, guncelleme: serverTimestamp() });

                // ---- Mail bildirimi ----
                let ek = '';
                let ekTur = 'ok';
                if ($('mailGonder').checked) {
                    if (gun !== bugunAnahtar()) {
                        ek = ' Mail gönderilmedi: bu not bugüne ait değil.';
                    } else if (!mailAyariVar()) {
                        ek = ' Mail ayarı henüz yapılmamış, mail gitmedi.';
                        ekTur = 'err';
                    } else if (Date.now() - sonMailZamani() < MAIL_BEKLEME_DK * 60000
                               && !confirm('Son ' + MAIL_BEKLEME_DK + ' dakika içinde zaten mail gönderdin. Yine de göndereyim mi?')) {
                        ek = ' Mail gönderilmedi.';
                    } else {
                        try {
                            await bildirimMailiGonder();
                            sonMailZamaniniKaydet();
                            ek = ' Mail gönderildi 📧';
                        } catch (e) {
                            ek = ' ⚠️ Mail gönderilemedi: ' + (e.message || e);
                            ekTur = 'err';
                        }
                    }
                }
                mesaj($('editMsg'), 'Kaydedildi ✅ Site güncellendi.' + ek, ekTur);
            } catch (e) {
                mesaj($('editMsg'), 'Kaydedilemedi: ' + hataYazisi(e), 'err');
            }
            $('kaydetBtn').disabled = false;
        });

        $('silBtn').addEventListener('click', async () => {
            const gun = $('tarih').value;
            if (!gun || !confirm(gun + ' tarihli not silinsin mi?')) return;
            try {
                await deleteDoc(doc(db, 'notlar', gun));
                $('metin').value = '';
                $('sayi').textContent = '0';
                mesaj($('editMsg'), 'Silindi. O gün sitedeki hazır listeden not gösterilecek.', 'ok');
            } catch (e) {
                mesaj($('editMsg'), 'Silinemedi: ' + hataYazisi(e), 'err');
            }
        });

        // ===================== FOTOĞRAF =====================
        const MAX_KENAR = 1100;      // fotoğrafın uzun kenarı en fazla bu kadar piksel olur
        const MAX_KARAKTER = 900000; // Firestore belge sınırı (1 MB) altında kalmak için

        function resmiSikistir(dosya) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(dosya);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    const oran = Math.min(1, MAX_KENAR / Math.max(img.naturalWidth, img.naturalHeight));
                    const w = Math.round(img.naturalWidth * oran);
                    const h = Math.round(img.naturalHeight * oran);

                    const c = document.createElement('canvas');
                    c.width = w;
                    c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);

                    let kalite = 0.75;
                    let veri = c.toDataURL('image/jpeg', kalite);
                    while (veri.length > MAX_KARAKTER && kalite > 0.3) {
                        kalite -= 0.1;
                        veri = c.toDataURL('image/jpeg', kalite);
                    }
                    if (veri.length > MAX_KARAKTER) return reject(new Error('Fotoğraf çok büyük, küçültülemedi.'));
                    resolve({ veri, genislik: w, yukseklik: h });
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Fotoğraf okunamadı.'));
                };
                img.src = url;
            });
        }

        $('yukleBtn').addEventListener('click', async () => {
            const dosyalar = Array.from($('dosyalar').files);
            const baslik = $('baslik').value.trim();
            if (!dosyalar.length) return mesaj($('fotoMsg'), 'Önce fotoğraf seç.', 'err');

            $('yukleBtn').disabled = true;
            let basarili = 0;
            const hatalar = [];

            for (let i = 0; i < dosyalar.length; i++) {
                mesaj($('fotoMsg'), `Yükleniyor... (${i + 1}/${dosyalar.length})`);
                try {
                    const { veri, genislik, yukseklik } = await resmiSikistir(dosyalar[i]);
                    await addDoc(collection(db, 'fotolar'), {
                        veri, genislik, yukseklik, baslik,
                        olusturma: serverTimestamp()
                    });
                    basarili++;
                } catch (e) {
                    hatalar.push(dosyalar[i].name + ': ' + hataYazisi(e));
                }
            }

            $('yukleBtn').disabled = false;

            if (hatalar.length) {
                mesaj($('fotoMsg'), `${basarili} yüklendi, ${hatalar.length} hata: ` + hatalar.join(' | '), 'err');
            } else {
                mesaj($('fotoMsg'), `${basarili} fotoğraf yüklendi ✅ Galeriye eklendi.`, 'ok');
                $('dosyalar').value = '';
                $('baslik').value = '';
            }
        });

        function fotolariDinle() {
            if (fotoDinleyiciKapat) fotoDinleyiciKapat();

            const q = query(collection(db, 'fotolar'), orderBy('olusturma', 'desc'), limit(60));
            fotoDinleyiciKapat = onSnapshot(q, (snap) => {
                const liste = $('fotoListe');
                liste.replaceChildren();

                if (snap.empty) {
                    const bos = document.createElement('div');
                    bos.className = 'empty';
                    bos.textContent = 'Henüz yüklenmiş fotoğraf yok.';
                    liste.append(bos);
                    $('fotoToplam').textContent = '';
                    return;
                }

                snap.docs.forEach((d) => {
                    const f = d.data();
                    if (!f.veri) return;

                    const kutu = document.createElement('div');
                    kutu.className = 'thumb';

                    const img = document.createElement('img');
                    img.src = f.veri;
                    img.alt = '';

                    const sil = document.createElement('button');
                    sil.className = 'del';
                    sil.textContent = '✕';
                    sil.title = 'Sil';
                    sil.addEventListener('click', async () => {
                        if (!confirm('Bu fotoğraf galeriden silinsin mi?')) return;
                        try {
                            await deleteDoc(doc(db, 'fotolar', d.id));
                        } catch (e) {
                            mesaj($('fotoMsg'), 'Silinemedi: ' + hataYazisi(e), 'err');
                        }
                    });

                    kutu.append(img, sil);

                    if (f.baslik) {
                        const cap = document.createElement('div');
                        cap.className = 'cap';
                        cap.textContent = f.baslik;
                        kutu.append(cap);
                    }

                    liste.append(kutu);
                });

                $('fotoToplam').textContent = `${snap.size} fotoğraf (siteye en yeni 40 tanesi gösterilir)`;
            }, (e) => {
                mesaj($('fotoMsg'), 'Liste okunamadı: ' + hataYazisi(e), 'err');
            });
        }
    </script>
</body>
</html>
