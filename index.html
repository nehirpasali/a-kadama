<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aşk adamıma...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 420px;
            width: 90%;
        }

        /* ===== KİLİT EKRANI ARKA PLANI (soluk, yumuşak, göz yormayan) ===== */
        #kilitArkaplan {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('kilit-arkaplan.jpg') 60% center / cover no-repeat;
            filter: blur(1.5px) saturate(0.8);
            transform: scale(1.04);   /* blur kenarlarında açılma olmasın */
            opacity: 0;
            animation: arkaplanGelsin 2.5s ease forwards;
            pointer-events: none;
        }

        /* Fotoğrafın üstüne koyu bir örtü: yazılar rahat okunsun, göz yorulmasın */
        #kilitArkaplan::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.58), rgba(15, 52, 96, 0.66));
        }

        @keyframes arkaplanGelsin {
            to { opacity: 0.5; }
        }

        #loginScreen {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 1.55rem;
            margin-bottom: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            line-height: 1.35;
        }

        .subtitle {
            font-size: 0.95rem;
            opacity: 0.7;
            margin-bottom: 35px;
        }

        .date-inputs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .date-inputs input {
            width: 70px;
            height: 55px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .date-inputs input:focus {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.15);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }

        .date-inputs input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.1rem;
        }

        .slash {
            font-size: 1.8rem;
            opacity: 0.6;
            font-weight: 300;
        }

        .date-inputs input.year {
            width: 95px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #e94560, #c23a51);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
        }

        .error {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
            min-height: 20px;
        }

        .error.show {
            opacity: 1;
        }

        .hint {
            margin-top: 25px;
            font-size: 0.8rem;
            opacity: 0.45;
        }

        /* ===== GALERİ ===== */
        #gallery {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            z-index: 100;
        }

        .gallery-header {
            position: absolute;
            top: 105px;
            left: 0;
            right: 0;
            padding: 12px 20px 12px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
            z-index: 20;
            pointer-events: none;
        }

        .gallery-header h2 {
            font-size: 1.35rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .gallery-header p {
            font-size: 0.82rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .photos-wrapper {
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;          /* elle kaydırılabilir, otomatik kayma JS ile */
            position: relative;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .photos-wrapper::-webkit-scrollbar {
            display: none;
        }

        .photos-track {
            column-count: 2;       /* tarayıcı iki sütunu boy olarak dengeler */
            column-gap: 16px;
            padding: 230px 16px 90px;
            width: 100%;
            max-width: 760px;      /* bilgisayarda kartlar devasa olmasın, galeri ortada dursun */
            margin: 0 auto;
        }

        /* ===== FOTOĞRAF KARTLARI (3 tema: sinematik | pastel | minimal) =====
           Hangi temanın kullanılacağı aşağıdaki script içinde "const TEMA" satırında seçilir. */
        .photo-card {
            position: relative;
            break-inside: avoid;
            margin-bottom: 18px;
            cursor: zoom-in;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            background: #2a2a3a;
        }

        .photo-caption:empty {
            display: none;
        }

        /* ---------- TEMA 1: SİNEMATİK (koyu zemin, altın çerçeve, fotoğraf üstünde yazı) ---------- */
        body[data-tema="sinematik"] #gallery {
            background: radial-gradient(ellipse at top, #1d2238 0%, #0b0d17 72%);
        }

        body[data-tema="sinematik"] .photo-card {
            padding: 6px;
            background: linear-gradient(145deg, rgba(212, 175, 120, 0.30), rgba(212, 175, 120, 0.08));
            border: 1px solid rgba(212, 175, 120, 0.6);
            border-radius: 6px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6);
        }

        body[data-tema="sinematik"] .photo-card img {
            border-radius: 3px;
            filter: contrast(1.05) saturate(0.95);
        }

        body[data-tema="sinematik"] .photo-caption {
            position: absolute;
            left: 6px;
            right: 6px;
            bottom: 6px;
            padding: 38px 12px 10px;
            border-radius: 0 0 3px 3px;
            background: linear-gradient(to top, rgba(8, 10, 20, 0.9), transparent);
            font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-size: 0.95rem;
            line-height: 1.3;
            text-align: center;
            color: #f1dcb3;
        }

        /* ---------- TEMA 2: PASTEL (yumuşak mor-pembe zemin, yuvarlak krem kartlar) ---------- */
        body[data-tema="pastel"] #gallery {
            background: linear-gradient(160deg, #3a2748 0%, #5b3a66 45%, #7a4a6e 100%);
        }

        body[data-tema="pastel"] .photo-card {
            padding: 8px 8px 0;
            background: rgba(255, 244, 248, 0.96);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(40, 10, 40, 0.38), 0 0 0 3px rgba(255, 190, 210, 0.35);
        }

        body[data-tema="pastel"] .photo-card img {
            border-radius: 16px;
        }

        body[data-tema="pastel"] .photo-caption {
            padding: 8px 8px 11px;
            font-family: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.15;
            text-align: center;
            color: #8a3a5a;
        }

        /* ---------- TEMA 3: MİNİMAL (sade, ince çizgili, koyu) ---------- */
        body[data-tema="minimal"] #gallery {
            background: #0e1118;
        }

        body[data-tema="minimal"] .photo-card {
            background: #171b26;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        body[data-tema="minimal"] .photo-caption {
            padding: 10px 12px;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            line-height: 1.35;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
        }

        /* Fare ile üstüne gelince hafif yükselme (sadece bilgisayarda) */
        @media (hover: hover) {
            body[data-tema="sinematik"] .photo-card:hover {
                transform: translateY(-4px);
                border-color: rgba(212, 175, 120, 0.95);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 24px rgba(212, 175, 120, 0.25);
            }
            body[data-tema="pastel"] .photo-card:hover {
                transform: translateY(-4px) scale(1.02);
                box-shadow: 0 16px 34px rgba(40, 10, 40, 0.5), 0 0 0 3px rgba(255, 190, 210, 0.6);
            }
            body[data-tema="minimal"] .photo-card:hover {
                transform: translateY(-3px);
                border-color: rgba(255, 255, 255, 0.28);
            }
        }

        @keyframes slowScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }

        /* ===== SAYAÇ BANNER ===== */
        #topBanner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            text-align: center;
            padding: 10px 10px 8px;
            z-index: 999;
        }

        .sayac-baslik {
            font-size: 0.8rem;
            opacity: 0.75;
            margin-bottom: 6px;
        }

        .sayac-kutular {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .kutu {
            min-width: 52px;
            padding: 6px 4px;
            background: rgba(233, 69, 96, 0.18);
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 10px;
        }

        .kutu span {
            display: block;
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .kutu small {
            font-size: 0.65rem;
            opacity: 0.7;
        }

        .sayac-toplam {
            font-size: 0.72rem;
            opacity: 0.6;
            margin-top: 5px;
        }

        @media (max-width: 400px) {
            .photos-track {
                column-gap: 12px;
                padding: 220px 12px 90px;
            }
            .photo-card {
                margin-bottom: 14px;
            }
            .kutu {
                min-width: 48px;
            }
            .sayac-kutular {
                gap: 6px;
            }
        }

        /* ===== GÜNLÜK NOT POP-UP ===== */
        #noteOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            z-index: 1500;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #noteOverlay.show {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        .note-card {
            position: relative;
            max-width: 380px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 34px 26px 26px;
            text-align: center;
            background: linear-gradient(145deg, rgba(233, 69, 96, 0.22), rgba(22, 33, 62, 0.95));
            border: 1px solid rgba(233, 69, 96, 0.45);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .note-heart {
            font-size: 2.2rem;
            margin-bottom: 6px;
            animation: beat 1.4s ease-in-out infinite;
        }

        .note-date {
            font-size: 0.78rem;
            opacity: 0.6;
            margin-bottom: 14px;
        }

        .note-text {
            font-size: 1.05rem;
            line-height: 1.6;
            white-space: pre-line;
            margin-bottom: 22px;
        }

        .note-close {
            padding: 11px 26px;
            width: auto;
            font-size: 0.95rem;
        }

        #noteBtn {
            display: none;
            position: fixed;
            right: 16px;
            bottom: 18px;
            width: 52px;
            height: 52px;
            padding: 0;
            font-size: 1.5rem;
            border-radius: 50%;
            z-index: 500;
        }

        /* ===== 2. SAYAÇ POP-UP (7 Ağustos'tan beri) ===== */
        #sayacBtn {
            display: none;
            position: fixed;
            right: 16px;
            bottom: 82px;
            width: 52px;
            height: 52px;
            padding: 0;
            font-size: 1.5rem;
            border-radius: 50%;
            z-index: 500;
        }

        .sayac-popup {
            display: none;
            position: fixed;
            right: 16px;
            bottom: 146px;
            width: min(330px, calc(100vw - 32px));
            padding: 18px 12px 14px;
            text-align: center;
            background: linear-gradient(145deg, rgba(233, 69, 96, 0.22), rgba(22, 33, 62, 0.96));
            border: 1px solid rgba(233, 69, 96, 0.45);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 600;
        }

        .sayac-popup.show {
            display: block;
            animation: sayacAcil 0.25s ease;
        }

        .sayac-popup .sayac-baslik {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-bottom: 10px;
        }

        @keyframes sayacAcil {
            from { opacity: 0; transform: translateY(10px) scale(0.96); }
            to   { opacity: 1; transform: none; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn  { from { opacity: 0; transform: scale(0.7) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes beat   { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    </style>
</head>
<body>

    <!-- LIGHTBOX -->
    <div id="lightbox" style="

        <img id="lightboxImg" alt="" style="max-width: 92%; max-height: 92%; border-radius: 12px; object-fit: contain;">

    <!-- GÜNLÜK NOT (lightbox'ın DIŞINDA olmalı) -->

    <button id="noteBtn" onclick="notuAc()" title="Günün notu">💌</button>

            <div class="kutu"><span id="s2Dk">00</span><small>dakika</small></div>
            <div class="kutu"><span id="s2Sn">00</span><small>saniye</small></div>

    <!-- ŞİFRE EKRANI -->

        <div class="date-inputs">

    <!-- GALERİ -->
    <div id="gallery">
        <div class="gallery-header">
            <h2> <3 </h2>
            <p>İyi ki sen sevgilim &lt;3</p>
        </div>

        <div class="photos-wrapper">
            <div class="photos-track" id="photosTrack">

    <script>
        // ===== TEMA SEÇİMİ =====
        // Galerinin görünümü: 'sinematik' | 'pastel' | 'minimal'  (sadece tırnak içindeki kelimeyi değiştir)
        const TEMA = 'sinematik';
        document.body.dataset.tema = TEMA;

        // ===== GALERİ (iki sütun, aynı fotoğraf yan yana gelmez) =====
        // HTML'deki ilk 10 fotoğraf "temel set" olarak saklanır
        const TEMEL_KARTLAR = Array.from(document.querySelectorAll('#photosTrack .photo-card'))
            .slice(0, 10)
            .map((k) => k.cloneNode(true));

        function fotoKartiYap(f) {
            const kart = document.createElement('div');
            kart.className = 'photo-card';
            const img = document.createElement('img');
            img.src = f.veri;
            img.alt = 'anımız';
            const cap = document.createElement('div');
            cap.className = 'photo-caption';
            cap.textContent = f.baslik || '';
            kart.append(img, cap);
            return kart;
        }

        // yeniFotolar: panelden yüklenenler (en yeni önce). Altına hazır fotoğraflar eklenir.
        // Her fotoğraf galeride SADECE BİR KEZ yer alır.
        function galeriyiKur(yeniFotolar) {
            const track = document.getElementById('photosTrack');
            const gorulen = new Set();
            const tekil = (anahtar) => { if (!anahtar || gorulen.has(anahtar)) return false; gorulen.add(anahtar); return true; };

            // Aynı fotoğraf iki kez geçse bile sadece ilki alınır
            const yeniKartlar = yeniFotolar.filter((f) => tekil(f.veri)).map(fotoKartiYap);
            const hazirKartlar = TEMEL_KARTLAR
                .filter((k) => tekil(k.querySelector('img').getAttribute('src')))
                .map((k) => k.cloneNode(true));
            const tumu = [...yeniKartlar, ...hazirKartlar];

            // Kartlar tek listeye konur; tarayıcı iki sütunu eşit boyda dengeler
            track.replaceChildren(...tumu);
        }

        galeriyiKur([]); // Firebase gelmese bile hazır fotoğraflarla çalışır

        // ===== OTOMATİK KAYDIRMA: yukarıdan aşağı, sona gelince geri yukarı =====
        const KAYMA_HIZI = 30;      // saniyede piksel (yavaşlatmak için küçült, hızlandırmak için büyüt)
        const UC_BEKLEME = 2500;    // en üstte / en altta kaç ms beklesin
        const DOKUNMA_BEKLEME = 4000; // elle kaydırınca kaç ms sonra otomatik kayma devam etsin
        const galeriKutu = document.querySelector('.photos-wrapper');
        let kaymaYonu = 1, konum = 0, sonZaman = 0, beklemeBitis = 0;

        ['wheel', 'touchstart', 'touchmove', 'pointerdown', 'keydown'].forEach((olay) =>
            galeriKutu.addEventListener(olay, () => { beklemeBitis = performance.now() + DOKUNMA_BEKLEME; }, { passive: true })
        );

        function otoKaydir(t) {
            const dt = Math.min(64, t - (sonZaman || t));
            sonZaman = t;
            const max = galeriKutu.scrollHeight - galeriKutu.clientHeight;

            if (t < beklemeBitis || max <= 0) {
                konum = galeriKutu.scrollTop; // elle kaydırıldıysa kaldığı yerden devam
            } else {
                konum += kaymaYonu * KAYMA_HIZI * dt / 1000;
                if (konum >= max) { konum = max; kaymaYonu = -1; beklemeBitis = t + UC_BEKLEME; }
                else if (konum <= 0) { konum = 0; kaymaYonu = 1; beklemeBitis = t + UC_BEKLEME; }
                galeriKutu.scrollTop = konum;
            }
            requestAnimationFrame(otoKaydir);
        }
        requestAnimationFrame(otoKaydir);

        // ===== LIGHTBOX =====
        document.addEventListener('click', function (e) {
            if (e.target.tagName === 'IMG' && e.target.closest('.photo-card')) {
                document.getElementById('lightboxImg').src = e.target.src;
                document.getElementById('lightbox').style.display = 'flex';
            }
        });

        document.getElementById('lightbox').addEventListener('click', function () {
            this.style.display = 'none';
        });

        // ===== ŞİFRE GİRİŞİ =====
        const day = document.getElementById('day');
        const month = document.getElementById('month');
        const year = document.getElementById('year');

        day.addEventListener('input', () => {
            if (day.value.length === 2) month.focus();
        });
        month.addEventListener('input', () => {
            if (month.value.length === 2) year.focus();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // ===== SAYAÇ =====
        // 07 Şubat 2026 (JavaScript'te aylar 0'dan başlar: Ocak = 0, Şubat = 1)
        // Saati de eklemek istersen: new Date(2026, 1, 7, 21, 30, 0)
        const BASLANGIC = new Date(2026, 1, 7, 0, 0, 0);

        // 2. sayaç: 07 Ağustos 2026 (ay 0'dan başlar: Ağustos = 7)
        const BASLANGIC_2 = new Date(2026, 7, 7, 0, 0, 0);
        let sayacInterval = null;

        // Verilen başlangıç tarihinden bu yana geçen süreyi hesaplayıp ilgili kutulara yazar
        function sayaciHesapla(baslangic, id) {
            const simdi = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const yaz = (anahtar, deger) => { document.getElementById(id[anahtar]).textContent = deger; };

            // Başlangıç tarihi henüz gelmediyse hepsi sıfır görünsün
            if (simdi < baslangic) {
                yaz('ay', 0); yaz('gun', 0); yaz('saat', '00'); yaz('dk', '00'); yaz('sn', '00'); yaz('toplam', 0);
                return;
            }

            // Takvime göre tam ay sayısı
            let ay = (simdi.getFullYear() - baslangic.getFullYear()) * 12
                   + (simdi.getMonth() - baslangic.getMonth());
            let ankraj = new Date(baslangic);
            ankraj.setMonth(baslangic.getMonth() + ay);
            if (ankraj > simdi) {
                ay--;
                ankraj = new Date(baslangic);
                ankraj.setMonth(baslangic.getMonth() + ay);
            }

            // Tam aydan sonra kalan süre
            const fark = simdi - ankraj;
            yaz('ay', ay);
            yaz('gun', Math.floor(fark / 86400000));
            yaz('saat', pad(Math.floor((fark % 86400000) / 3600000)));
            yaz('dk', pad(Math.floor((fark % 3600000) / 60000)));
            yaz('sn', pad(Math.floor((fark % 60000) / 1000)));
            yaz('toplam', Math.floor((simdi - baslangic) / 86400000));
        }

        // İki sayacı birden günceller (her saniye çağrılır)
        function sayaciGuncelle() {
            sayaciHesapla(BASLANGIC,   { ay: 'sAy',  gun: 'sGun',  saat: 'sSaat',  dk: 'sDk',  sn: 'sSn',  toplam: 'toplamGun' });
            sayaciHesapla(BASLANGIC_2, { ay: 's2Ay', gun: 's2Gun', saat: 's2Saat', dk: 's2Dk', sn: 's2Sn', toplam: 'toplamGun2' });
        }

        // ===== YERLEŞİM: galeri, üstteki sayaç bandının altından başlasın =====
        function yerlesimiAyarla() {
            const banner = document.getElementById('topBanner');
            const baslik = document.querySelector('.gallery-header');
            if (!banner.offsetHeight) return;
            baslik.style.top = banner.offsetHeight + 'px';
            document.getElementById('photosTrack').style.paddingTop = (banner.offsetHeight + baslik.offsetHeight + 40) + 'px';
        }
        if (window.ResizeObserver) new ResizeObserver(yerlesimiAyarla).observe(document.getElementById('topBanner'));
        window.addEventListener('resize', yerlesimiAyarla);

        // ===== GÜNLÜK NOT =====
        // Her gün sırayla bir sonraki not gösterilir, liste bitince başa döner.
        // Notları istediğin kadar ekleyebilirsin (satır atlamak için \n kullan).
        const NOTLAR = [

            // buraya yenilerini ekle...
        ];

        // Belirli bir güne özel not (YYYY-AA-GG). Bu tarihte sıradaki not yerine bu görünür.
        const OZEL_NOTLAR = {
            "2026-11-07": "9. ayımız kutlu olsun aşkım! 🎉\nSeni çok seviyorum.",
            "2026-12-31": "Yeni yıla seninle girmek en büyük hediye ❤️"
        };

        function gununNotunuGetir() {
            // Yönetici panelinden girilen canlı not varsa önce o gösterilir
            if (window.CANLI_NOT) return window.CANLI_NOT;

            const bugun = new Date();
            const anahtar = `${bugun.getFullYear()}-${String(bugun.getMonth() + 1).padStart(2, '0')}-${String(bugun.getDate()).padStart(2, '0')}`;

            if (OZEL_NOTLAR[anahtar]) return OZEL_NOTLAR[anahtar];

            // Hazır liste boşsa (ve panelden not girilmediyse) sadece kalp göster
            if (!NOTLAR.length) return "❤️";

            // Başlangıçtan bu yana geçen gün sayısına göre sıradaki not
            const gunSayisi = Math.floor((new Date(bugun.getFullYear(), bugun.getMonth(), bugun.getDate()) - BASLANGIC) / 86400000);
            const index = ((gunSayisi % NOTLAR.length) + NOTLAR.length) % NOTLAR.length;
            return NOTLAR[index];
        }

        function notuAc() {
            document.getElementById('noteDate').textContent =
                new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' });
            document.getElementById('noteText').textContent = gununNotunuGetir();
            document.getElementById('noteOverlay').classList.add('show');
        }

        function notuKapat() {
            document.getElementById('noteOverlay').classList.remove('show');
        }

        document.getElementById('noteOverlay').addEventListener('click', function (e) {
            if (e.target === this) notuKapat();
        });

        // ===== 2. SAYAÇ POP-UP =====
        // Bilgisayar: imleç ⏳ simgesinin ya da pop-up'ın üstündeyken açık kalır, çekilince kapanır.
        // Telefon: ⏳ simgesine dokununca açılır/kapanır, dışarı dokununca da kapanır.
        const sayacBtn = document.getElementById('sayacBtn');
        const sayacPopup = document.getElementById('sayacPopup');
        const imlecVar = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        let sayacKapatZamani = null;

        function sayacAc() { clearTimeout(sayacKapatZamani); sayacPopup.classList.add('show'); }
        function sayacKapat() { clearTimeout(sayacKapatZamani); sayacPopup.classList.remove('show'); }
        function sayacKapatGecikmeli() { clearTimeout(sayacKapatZamani); sayacKapatZamani = setTimeout(sayacKapat, 250); }

        if (imlecVar) {
            [sayacBtn, sayacPopup].forEach((el) => {
                el.addEventListener('mouseenter', sayacAc);
                el.addEventListener('mouseleave', sayacKapatGecikmeli);
            });
            sayacBtn.addEventListener('click', sayacAc);
        } else {
            sayacBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                sayacPopup.classList.contains('show') ? sayacKapat() : sayacAc();
            });
            document.addEventListener('click', (e) => {
                if (!sayacPopup.contains(e.target)) sayacKapat();
            });
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') sayacKapat(); });

        // ===== ŞİFRE KONTROLÜ =====
        function checkPassword() {
            const d = day.value.padStart(2, '0');
            const m = month.value.padStart(2, '0');
            const y = year.value;
            const entered = `${d}/${m}/${y}`;
            const correct = "07/08/2026";
            const errorMsg = document.getElementById('errorMsg');

            if (entered === correct) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('kilitArkaplan').style.display = 'none';
                document.getElementById('gallery').style.display = 'block';
                document.getElementById('topBanner').style.display = 'block';

                sayaciGuncelle();
                if (!sayacInterval) sayacInterval = setInterval(sayaciGuncelle, 1000);

                // Günlük not pop-up'ı
                document.getElementById('noteBtn').style.display = 'block';
                document.getElementById('sayacBtn').style.display = 'block';
                setTimeout(notuAc, 700);
            } else {
                errorMsg.classList.add('show');
                document.querySelector('.date-inputs').style.animation = 'shake 0.4s';
                setTimeout(() => {
                    document.querySelector('.date-inputs').style.animation = '';
                    errorMsg.classList.remove('show');
                }, 1500);
            }
        }
    </script>

    <!-- ===== FIREBASE: YÖNETİCİ PANELİNDEN GELEN CANLI NOT ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit }
            from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        // ====== BURAYI KENDİ FIREBASE BİLGİLERİNLE DEĞİŞTİR (admin.html ile aynı) ======
        const firebaseConfig = {
            apiKey: "AIzaSyCGJShg-OYUPmjg0D3yw2INrdfPiPPWxBU",
            authDomain: "admin-7659a.firebaseapp.com",
            projectId: "admin-7659a",
            storageBucket: "admin-7659a.firebasestorage.app",
            messagingSenderId: "155622622732",
            appId: "1:155622622732:web:607b42a6ea36370a161029"
        };
        // ===============================================================================

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);

            const b = new Date();
            const anahtar = `${b.getFullYear()}-${String(b.getMonth() + 1).padStart(2, '0')}-${String(b.getDate()).padStart(2, '0')}`;

            // Bugünün notunu canlı dinle: panelden kaydedince anında buraya düşer
            onSnapshot(doc(db, "notlar", anahtar), (snap) => {
                window.CANLI_NOT = snap.exists() ? snap.data().metin : null;

                // Pop-up o an açıksa yenilemeden güncelle
                const overlay = document.getElementById('noteOverlay');
                if (overlay.classList.contains('show')) {
                    document.getElementById('noteText').textContent = gununNotunuGetir();
                }
            }, (err) => console.warn("Canlı not okunamadı, hazır liste kullanılacak:", err.code));

            // ----- Panelden yüklenen fotoğraflar (galeriye canlı eklenir) -----
            const FOTO_LIMITI = 40; // en yeni kaç fotoğraf gösterilsin

            onSnapshot(
                query(collection(db, "fotolar"), orderBy("olusturma", "desc"), limit(FOTO_LIMITI)),
                (snap) => window.galeriyiKur(snap.docs.map((d) => d.data()).filter((f) => f.veri)),
                (err) => console.warn("Fotoğraflar okunamadı, hazır fotoğraflar kullanılacak:", err.code)
            );
        } catch (e) {
            console.warn("Firebase başlatılamadı, hazır liste kullanılacak:", e);
        }
    </script>
